[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "warplab"
version = "1.1.0"
description = "Inspectable soft-DTW, Gibbs path flows and covariance Hessian products"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
warplab = "warplab.__main__:main"
[tool.setuptools]
packages = ["warplab"]
